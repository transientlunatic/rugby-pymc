[pytest]
testpaths = tests
python_files = test_*.py *_test.py
addopts = --cov=rugby_ranking --cov-report=html --cov-report=term-missing
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    statistical: simulation-based calibration and P-P tests; run manually when making major model changes (pytest -m statistical)
